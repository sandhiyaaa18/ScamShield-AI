{% extends 'scamshield_app/base.html' %}
{% block content %}
<div class="reset-box">
    <h2>🔑 Reset Password</h2>
    <p>Enter your email address to receive a password reset link.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-submit">Send Reset Link</button>
    </form>
</div>
{% endblock %}
